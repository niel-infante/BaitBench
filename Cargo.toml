[package]
name = "baitbench"
version = "0.1.0"
edition = "2021"
description = "Probe capture efficiency testing via in-silico simulation"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
chrono = "0.4"
rammap-core = { version = "1.1.1", features = ["parallel"] }
rayon = "1"

[profile.release]
lto = true
strip = true
