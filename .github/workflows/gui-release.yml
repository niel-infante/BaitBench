name: GUI Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = all three)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-arm64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build baitbench CLI
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Copy sidecar binary
        working-directory: gui
        run: node scripts/copy-sidecar.mjs

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri:build

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaitBench-macOS-arm64
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/macos/*.app
            target/release/baitbench
          if-no-files-found: warn

  build-macos-x64:
    name: macOS (Intel)
    runs-on: macos-13
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-x64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build baitbench CLI
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Copy sidecar binary
        working-directory: gui
        run: node scripts/copy-sidecar.mjs

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri:build

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaitBench-macOS-x64
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/macos/*.app
            target/release/baitbench
          if-no-files-found: warn

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build baitbench CLI
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Copy sidecar binary
        working-directory: gui
        run: node scripts/copy-sidecar.mjs

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaitBench-Windows-x64
          path: |
            gui/src-tauri/target/release/bundle/msi/*.msi
            gui/src-tauri/target/release/bundle/nsis/*.exe
            target/release/baitbench.exe
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-macos-arm64, build-macos-x64, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
