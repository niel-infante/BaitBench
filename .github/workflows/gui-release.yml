name: GUI Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = all three)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows
  push:
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-arm64'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build baitbench CLI
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Copy sidecar binary
        working-directory: gui
        run: node scripts/copy-sidecar.mjs

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri:build

      - name: Rename artifact
        run: |
          DMG=$(find gui/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$DMG" BaitBench-macOS.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaitBench-macOS
          path: BaitBench-macOS.dmg
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "BaitBench ${{ github.ref_name }}" \
            --generate-notes \
            2>/dev/null || true
          gh release upload ${{ github.ref_name }} BaitBench-macOS.dmg --clobber

  build-macos-x64:
    name: macOS (Intel)
    runs-on: macos-13
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-x64'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build baitbench CLI
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Copy sidecar binary
        working-directory: gui
        run: node scripts/copy-sidecar.mjs

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri:build

      - name: Rename artifact
        run: |
          DMG=$(find gui/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$DMG" BaitBench-macOS-Intel.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaitBench-macOS-Intel
          path: BaitBench-macOS-Intel.dmg
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "BaitBench ${{ github.ref_name }}" \
            --generate-notes \
            2>/dev/null || true
          gh release upload ${{ github.ref_name }} BaitBench-macOS-Intel.dmg --clobber

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build baitbench CLI
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Copy sidecar binary
        working-directory: gui
        run: node scripts/copy-sidecar.mjs

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri:build

      - name: Rename artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem gui/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName BaitBench-Windows.msi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaitBench-Windows
          path: BaitBench-Windows.msi
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} --title "BaitBench ${{ github.ref_name }}" --generate-notes 2>$null
          gh release upload ${{ github.ref_name }} BaitBench-Windows.msi --clobber
