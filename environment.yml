name: baitbench
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Alignment tools
  # minimap2 is no longer required — alignment is handled by the rammap library
  # compiled into the baitbench binary.
  # For the standalone 'rammap' CLI: cargo install rammap
  - blast>=2.12
  # Clustering
  - cd-hit>=4.8
  # Probe design (optional: required for --method catch)
  - catch
  # Read simulators (optional: required for --read-simulator art / badread)
  - art_modern>=1.4.0
  - badread>=0.4.0
  # R and visualization
  - r-base>=4.2
  - r-ggplot2>=3.4
  - r-dplyr>=1.1
  - r-tidyr>=1.3
  - r-scales>=1.2
  - r-rmarkdown>=2.20
  - r-knitr>=1.40
  - r-optparse>=1.7
  - r-dt>=0.27
  - r-plotly>=4.8.0
  - r-ggrepel>=0.9
  - pandoc>=2.19
